apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-transaction-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-transaction-producer
  template:
    metadata:
      labels:
        app: java-transaction-producer
    spec:
      containers:
        - name: java-transaction-producer
          image: replace-with-your-transaction-producer-image
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: TRANSACTION_TOPIC
              value: "transaction.created"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-fraud-detection
  template:
    metadata:
      labels:
        app: java-fraud-detection
    spec:
      containers:
        - name: java-fraud-detection
          image: replace-with-your-fraud-detection-image
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: TRANSACTION_TOPIC
              value: "transaction.created"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-service
spec:
  selector:
    app: java-fraud-detection
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-nodeport
spec:
  type: NodePort
  selector:
    app: java-fraud-detection
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "local"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka-service:9092"
            - name: KAFKA_CLUSTERS_0_AUDIT_TOPIC_NAME
              value: "transaction.created"
          resources:
            requests:
              memory: "256Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-service
spec:
  type: NodePort
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
